<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contain">
        <h1>BMI Calculator</h1>
        <form>
        <p><label for="height">height in cm: </label><input type=" text" id="height"></p>
        <p><label for="weight">Weight in kg: </label><input type="text"  id="weight"></p>
        <button type="submit" id="but">calculate</button>
        <div id="results" class="result-box"></div>
        <div id="history"></div>
        <button type="button" id="clearHistory">Clear History</button>
        <div id="weight_guide">
            <h3>BMI height guide: </h3>
            <p>under weight = less than 18.6</p>
            <p>Normal range = 18.6 to 24.9</p>
            <p>Overweight = greater than 24.9</p>
        </div>
        </form>
    </div>
    
</body>
<script src="script.js"></script>
</html>
